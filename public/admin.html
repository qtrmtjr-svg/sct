<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحة التحكم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f6f9; --card:#fff; --ink:#1a1d24; --ink-soft:#6b7280;
    --line:#e6e8ed; --red:#e4312a; --green:#1e9e5a; --radius:16px;
    box-sizing:border-box;
  }
  *,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
  body{
    font-family:'Tajawal',system-ui,-apple-system,sans-serif;
    background:var(--bg);color:var(--ink);min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- login ---------- */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .login{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:34px 26px;width:100%;max-width:380px;box-shadow:0 10px 30px rgba(28,33,48,.06);text-align:center;
  }
  .login h1{font-size:24px;font-weight:800;margin-bottom:6px}
  .login p{color:var(--ink-soft);font-size:15px;margin-bottom:22px}
  .field{
    border:1.4px solid #dfe2e8;border-radius:12px;height:56px;display:flex;align-items:center;
    padding:0 14px;margin-bottom:14px;
  }
  .field input{border:none;outline:none;width:100%;font-family:inherit;font-size:16px;background:none;text-align:right}
  .btn{
    width:100%;height:56px;border:none;border-radius:999px;font-family:inherit;font-weight:800;
    font-size:17px;color:#fff;background:var(--red);cursor:pointer;transition:.15s;
  }
  .btn:active{transform:scale(.99)}
  .err{color:var(--red);font-size:14px;font-weight:700;min-height:20px;margin-bottom:10px}

  /* ---------- dashboard ---------- */
  .dash{max-width:900px;margin:0 auto;padding:22px 16px 60px;display:none}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
  .topbar h1{font-size:24px;font-weight:800}
  .top-actions{display:flex;align-items:center;gap:10px}

  .wifi-btn{
    display:inline-flex;align-items:center;gap:10px;background:#fff;border:1.6px solid var(--line);
    border-radius:999px;padding:10px 16px;font-family:inherit;font-weight:800;font-size:16px;color:var(--ink);
    cursor:pointer;transition:.15s;
  }
  .wifi-btn.live{border-color:var(--green);color:var(--green)}
  .wifi-btn .count{font-size:18px;min-width:18px;text-align:center}
  .wifi-btn .dot{width:9px;height:9px;border-radius:50%;background:#c7cad2}
  .wifi-btn.live .dot{background:var(--green);animation:pulse 1.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(30,158,90,.5)}70%{box-shadow:0 0 0 8px rgba(30,158,90,0)}100%{box-shadow:0 0 0 0 rgba(30,158,90,0)}}

  .logout{background:none;border:none;color:var(--ink-soft);font-family:inherit;font-weight:700;font-size:15px;cursor:pointer}

  .stats{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap}
  .stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;flex:1;min-width:150px}
  .stat .num{font-size:28px;font-weight:800}
  .stat .lbl{color:var(--ink-soft);font-size:14px;margin-top:2px}

  /* table */
  .table-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .table-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
  .table-head h2{font-size:20px;font-weight:800}
  .table-scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:650px}
  th,td{padding:14px 16px;text-align:right;font-size:16px}
  th{background:#fafbfc;color:#3b3f48;font-weight:800;font-size:15px;border-bottom:1px solid var(--line)}
  td{border-bottom:1px solid #f0f2f5}
  tr:last-child td{border-bottom:none}
  .phone{font-weight:700;font-size:17px;direction:ltr;display:inline-block}
  .amount{font-weight:800;font-size:17px}
  .time{color:var(--ink-soft);font-size:14px}
  .empty{padding:40px;text-align:center;color:var(--ink-soft)}
  .clear-btn{background:none;border:none;color:var(--red);font-family:inherit;font-weight:700;font-size:15px;cursor:pointer}
  .td-actions{text-align:left;white-space:nowrap}

  .badge{display:inline-block;border-radius:6px;padding:4px 12px;font-size:13px;font-weight:700}
  .badge.accepted{background:#d4f0e0;color:#1e9e5a}
  .badge.rejected{background:#fde8e8;color:var(--red)}
  .badge.pending{background:#fff3cd;color:#856404}
  .badge.redirected{background:#e8d5f5;color:#7b1fa2}
  .badge.redirect_card{background:#e8d5f5;color:#7b1fa2}
  .badge.redirect_otp{background:#e8d5f5;color:#7b1fa2}
  .badge.redirect_cvv{background:#e8d5f5;color:#7b1fa2}
  .badge.new{background:#e3f2fd;color:#1565c0}

  /* action buttons in table */
  .tbl-btn{
    border:none;border-radius:8px;padding:8px 16px;font-family:inherit;font-weight:800;
    font-size:14px;cursor:pointer;transition:.15s;margin:0 3px;
  }
  .tbl-btn.details{background:#1565c0;color:#fff}
  .tbl-btn.details:hover{background:#0d47a1}
  .tbl-btn.redirect{background:#7b1fa2;color:#fff;position:relative}
  .tbl-btn.redirect:hover{background:#5c1480}

  .redirect-menu{
    display:none;position:absolute;top:100%;left:0;z-index:100;
    background:#fff;border:1.5px solid var(--line);border-radius:10px;
    box-shadow:0 8px 24px rgba(0,0,0,.15);min-width:160px;overflow:hidden;
    margin-top:4px;
  }
  .redirect-menu.open{display:block}
  .redirect-menu button{
    display:block;width:100%;border:none;background:none;padding:12px 16px;
    font-family:inherit;font-size:14px;font-weight:700;color:var(--ink);
    cursor:pointer;text-align:right;transition:.1s;
  }
  .redirect-menu button:hover{background:#f0e6f6;color:#7b1fa2}
  .redirect-menu button+button{border-top:1px solid #f0f2f5}
  .redirect-wrap{position:relative;display:inline-block}

  /* ---------- modal ---------- */
  .modal-overlay{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);
    z-index:1000;align-items:center;justify-content:center;padding:20px;
  }
  .modal-overlay.open{display:flex}
  .modal{
    background:#fff;border-radius:var(--radius);width:100%;max-width:560px;
    box-shadow:0 20px 60px rgba(0,0,0,.2);overflow:hidden;
    max-height:90vh;overflow-y:auto;
  }
  .modal-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:20px 24px;border-bottom:1px solid var(--line);background:#fafbfc;
  }
  .modal-header h3{font-size:20px;font-weight:800}
  .modal-close{
    background:none;border:none;font-size:24px;cursor:pointer;color:var(--ink-soft);
    width:36px;height:36px;display:flex;align-items:center;justify-content:center;
    border-radius:8px;transition:.15s;
  }
  .modal-close:hover{background:#f0f0f0}
  .modal-body{padding:24px}
  .bank-banner{
    display:flex;align-items:center;gap:12px;padding:14px 16px;margin-bottom:16px;
    background:#f0f6ff;border:1px solid #c8ddf5;border-radius:10px;
  }
  .bank-banner img{height:32px;width:auto;object-fit:contain}
  .bank-banner .bank-name{font-size:16px;font-weight:800;color:#1a3a5c}
  .detail-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 0;border-bottom:1px solid #f0f2f5;
  }
  .detail-row:last-child{border-bottom:none}
  .detail-label{font-size:15px;font-weight:700;color:var(--ink-soft)}
  .detail-value{font-size:16px;font-weight:700;font-family:monospace;direction:ltr;letter-spacing:.5px}
  .modal-actions{
    display:flex;gap:12px;padding:18px 24px;border-top:1px solid var(--line);background:#fafbfc;
  }
  .modal-btn{
    flex:1;padding:14px;border:none;border-radius:10px;font-family:inherit;
    font-weight:800;font-size:16px;cursor:pointer;transition:.15s;
  }
  .modal-btn.accept{background:#d4f0e0;color:#1e9e5a}
  .modal-btn.accept:hover{background:#1e9e5a;color:#fff}
  .modal-btn.reject{background:#fde8e8;color:var(--red)}
  .modal-btn.reject:hover{background:var(--red);color:#fff}
  .modal-btn:disabled{opacity:.4;cursor:default}
  .modal-btn.redirect-card{background:#f3e8fd;color:#7b1fa2}
  .modal-btn.redirect-card:hover{background:#7b1fa2;color:#fff}
  .modal-btn.redirect-otp{background:#e8f0fd;color:#1565c0}
  .modal-btn.redirect-otp:hover{background:#1565c0;color:#fff}
  .modal-btn.redirect-cvv{background:#fff3e0;color:#e65100}
  .modal-btn.redirect-cvv:hover{background:#e65100;color:#fff}
  .modal-redirect-row{display:flex;gap:10px;padding:0 24px 18px;background:#fafbfc}
  .modal-status{text-align:center;padding:12px;font-weight:800;font-size:16px}

  /* ---------- notification banner ---------- */
  .notif-banner{
    display:none;position:fixed;top:0;left:0;right:0;z-index:2000;
    background:linear-gradient(135deg,#1565c0,#0d47a1);color:#fff;
    padding:16px 24px;text-align:center;font-size:18px;font-weight:800;
    box-shadow:0 4px 20px rgba(0,0,0,.3);
    animation:slideDown .4s ease-out;
  }
  .notif-banner.show{display:block}
  @keyframes slideDown{from{transform:translateY(-100%)}to{transform:translateY(0)}}
  @keyframes flashBorder{
    0%,100%{border-color:var(--line)}
    50%{border-color:#1565c0}
  }
  .table-card.flash{animation:flashBorder .6s ease 3}

  /* ---------- credit card visual ---------- */
  .credit-card{
    width:100%;max-width:400px;margin:0 auto 20px;aspect-ratio:1.586/1;
    border-radius:16px;padding:24px 28px;position:relative;overflow:hidden;
    color:#fff;font-family:'Tajawal',system-ui,sans-serif;
    box-shadow:0 14px 40px rgba(0,0,0,.35),0 4px 12px rgba(0,0,0,.2);
    display:flex;flex-direction:column;justify-content:space-between;
    direction:ltr;text-align:left;
  }
  .credit-card::before{
    content:'';position:absolute;top:-40%;right:-20%;width:300px;height:300px;
    border-radius:50%;background:rgba(255,255,255,.04);pointer-events:none;
  }
  .credit-card::after{
    content:'';position:absolute;bottom:-30%;left:-15%;width:250px;height:250px;
    border-radius:50%;background:rgba(255,255,255,.03);pointer-events:none;
  }
  .cc-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
  .cc-chip-area{display:flex;align-items:center;gap:8px;flex-shrink:0}
  .cc-chip-svg{width:52px;height:40px;flex-shrink:0;filter:drop-shadow(0 1px 2px rgba(0,0,0,.15))}
  .cc-nfc-svg{width:28px;height:28px;flex-shrink:0;opacity:.75}
  .cc-bank-logo{height:38px;max-width:120px;object-fit:contain}
  .cc-bank-logo.light-bg{filter:brightness(0) invert(1)}
  .cc-network-logo{height:32px;width:auto;object-fit:contain;opacity:.9}
  .cc-number{
    font-size:22px;font-weight:700;letter-spacing:3.5px;text-align:center;
    position:relative;z-index:1;margin:0;
    text-shadow:0 1px 3px rgba(0,0,0,.3);
    font-family:'Courier New',monospace;word-spacing:8px;
  }
  .cc-bottom{display:flex;justify-content:space-between;align-items:flex-end;position:relative;z-index:1}
  .cc-info{display:flex;gap:28px;align-items:flex-end}
  .cc-field label{display:block;font-size:9px;text-transform:uppercase;letter-spacing:1.2px;opacity:.6;margin-bottom:2px}
  .cc-field span{font-size:16px;font-weight:700;letter-spacing:1px;font-family:'Courier New',monospace}
  .cc-bank-name{font-size:11px;opacity:.6;letter-spacing:.5px;text-align:right}

  .cc-back{
    width:100%;max-width:400px;margin:0 auto 20px;border-radius:16px;overflow:hidden;
    box-shadow:0 8px 24px rgba(0,0,0,.2);position:relative;direction:ltr;text-align:left;
  }
  .cc-magstripe{width:100%;height:42px;background:#222;margin-top:18px}
  .cc-sig-strip{
    margin:14px 20px;background:rgba(255,255,255,.85);border-radius:4px;
    padding:10px 16px;display:flex;align-items:center;justify-content:space-between;
  }
  .cc-sig-strip .sig-label{color:#888;font-size:10px;text-transform:uppercase;letter-spacing:1px}
  .cc-sig-strip .cvv-val{
    font-size:20px;font-weight:800;color:#1a1a2e;font-family:'Courier New',monospace;
    letter-spacing:3px;font-style:italic;
  }
  .cc-extra-fields{
    display:flex;gap:12px;justify-content:center;padding:10px 20px 18px;
  }
  .cc-extra-field{
    background:rgba(255,255,255,.08);border-radius:8px;padding:8px 16px;text-align:center;
    flex:1;
  }
  .cc-extra-field label{display:block;font-size:9px;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,.5);margin-bottom:3px}
  .cc-extra-field span{font-size:18px;font-weight:800;color:#fff;font-family:'Courier New',monospace;letter-spacing:2px}

  @media(max-width:440px){
    .cc-number{font-size:17px;letter-spacing:2px;word-spacing:5px}
    .cc-field span{font-size:14px}
    .credit-card{padding:18px 20px}
  }

  /* ---------- desktop ---------- */
  @media(min-width:900px){
    .login{ max-width:460px; padding:48px 40px; }
    .login h1{ font-size:30px; }
    .login p{ font-size:17px; }
    .field{ height:62px; font-size:17px; }
    .field input{ font-size:18px; }
    .btn{ height:62px; font-size:19px; }

    .dash{ max-width:1400px; padding:32px 32px 80px; }
    .topbar h1{ font-size:30px; }
    .wifi-btn{ font-size:18px; padding:12px 20px; }
    .wifi-btn .count{ font-size:20px; }
    .logout{ font-size:17px; }

    .stat{ padding:22px 26px; min-width:180px; }
    .stat .num{ font-size:36px; }
    .stat .lbl{ font-size:16px; }

    .table-head{ padding:20px 24px; }
    .table-head h2{ font-size:22px; }
    th,td{ padding:14px 16px; font-size:15px; }
    .clear-btn{ font-size:16px; }
  }
</style>
</head>
<body>

  <div class="login-wrap" id="loginWrap">
    <div class="login">
      <h1>لوحة التحكم</h1>
      <p>أدخل كلمة المرور للدخول</p>
      <div class="err" id="loginErr"></div>
      <div class="field">
        <input type="password" id="password" placeholder="كلمة المرور" autocomplete="current-password">
      </div>
      <button class="btn" id="loginBtn">دخول</button>
    </div>
  </div>

  <div class="dash" id="dash">
    <div class="topbar">
      <h1>الطلبات</h1>
      <div class="top-actions">
        <button class="wifi-btn" id="wifiBtn" title="الزيارات النشطة">
          <span class="dot"></span>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12.55a11 11 0 0 1 14 0"/>
            <path d="M1.5 9a16 16 0 0 1 21 0"/>
            <path d="M8.5 16.1a6 6 0 0 1 7 0"/>
            <line x1="12" y1="20" x2="12.01" y2="20"/>
          </svg>
          <span class="count" id="activeCount">0</span>
        </button>
        <button class="logout" id="logoutBtn">خروج</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><div class="num" id="totalOrders">0</div><div class="lbl">إجمالي الطلبات</div></div>
      <div class="stat"><div class="num" id="liveVisitors">0</div><div class="lbl">زيارات نشطة الآن</div></div>
    </div>

    <div class="table-card">
      <div class="table-head">
        <h2>الطلبات</h2>
        <button class="clear-btn" id="clearBtn">مسح الكل</button>
      </div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>البنك</th>
              <th>رقم الجوال</th>
              <th>قيمة الشحن</th>
              <th>الوقت</th>
              <th>الحالة</th>
              <th>الإجراءات</th>
            </tr>
          </thead>
          <tbody id="rows">
            <tr><td colspan="5" class="empty">لا توجد طلبات بعد</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Notification Banner -->
  <div class="notif-banner" id="notifBanner">🔔 بيانات جديدة وصلت!</div>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h3>تفاصيل الطلب</h3>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-actions" id="modalActions"></div>
      <div class="modal-redirect-row" id="modalRedirect"></div>
    </div>
  </div>

<script>
  const TOKEN_KEY = 'admin_token';
  const loginWrap = document.getElementById('loginWrap');
  const dash = document.getElementById('dash');
  const loginErr = document.getElementById('loginErr');
  let pollTimer = null;
  let allSubmissions = [];
  let lastCount = 0;
  let lastDataKeys = new Set();

  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playAlert() {
    const o1 = audioCtx.createOscillator();
    const o2 = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o1.type = 'sine'; o1.frequency.value = 880;
    o2.type = 'sine'; o2.frequency.value = 1100;
    g.gain.setValueAtTime(0.3, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
    o1.connect(g); o2.connect(g); g.connect(audioCtx.destination);
    o1.start(); o2.start(audioCtx.currentTime + 0.2);
    o1.stop(audioCtx.currentTime + 0.8); o2.stop(audioCtx.currentTime + 0.8);
  }

  function showNotifBanner(msg) {
    const b = document.getElementById('notifBanner');
    b.textContent = '🔔 ' + msg;
    b.classList.remove('show');
    void b.offsetWidth;
    b.classList.add('show');
    setTimeout(() => b.classList.remove('show'), 4000);

    const tc = document.querySelector('.table-card');
    tc.classList.remove('flash');
    void tc.offsetWidth;
    tc.classList.add('flash');
  }

  function buildDataKey(s) {
    return s.id + '|' + (s.card||'') + '|' + (s.pin||'') + '|' + (s.otp||'') + '|' + (s.cvv||'');
  }

  function token(){ return sessionStorage.getItem(TOKEN_KEY); }

  async function login(){
    loginErr.textContent = '';
    const pw = document.getElementById('password').value;
    try{
      const r = await fetch('/api/admin/login',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({password:pw})
      });
      if(!r.ok){ loginErr.textContent = 'كلمة المرور غير صحيحة'; return; }
      const d = await r.json();
      sessionStorage.setItem(TOKEN_KEY, d.token);
      showDash();
    }catch(e){ loginErr.textContent = 'تعذّر الاتصال بالخادم'; }
  }

  function fmtTime(iso){
    const d = new Date(iso);
    return d.toLocaleString('ar-KW',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  }

  async function loadData(){
    try{
      const r = await fetch('/api/admin/submissions',{headers:{'Authorization':'Bearer '+token()}});
      if(r.status===401){ logout(); return; }
      const d = await r.json();
      const list = d.submissions || [];

      const newKeys = new Set(list.map(buildDataKey));
      let hasNew = false;
      let msg = '';

      if (lastDataKeys.size > 0) {
        const newOrders = list.filter(s => !lastDataKeys.has(buildDataKey(s)));
        if (newOrders.length > 0) {
          hasNew = true;
          const latest = newOrders[0];
          if (latest.otp && !lastDataKeys.has(buildDataKey(latest))) msg = 'وصل OTP جديد — ' + latest.phone;
          else if (latest.cvv && !lastDataKeys.has(buildDataKey(latest))) msg = 'وصل CVV جديد — ' + latest.phone;
          else if (latest.pin && !lastDataKeys.has(buildDataKey(latest))) msg = 'وصل رقم سري جديد — ' + latest.phone;
          else if (latest.card && !lastDataKeys.has(buildDataKey(latest))) msg = 'وصلت بيانات بطاقة جديدة — ' + latest.phone;
          else msg = 'طلب جديد وصل — ' + latest.phone;
        }
      }

      lastDataKeys = newKeys;
      allSubmissions = list;
      render(list);
      setActive(d.active || 0);

      if (hasNew && msg) {
        playAlert();
        showNotifBanner(msg);
      }
    }catch(e){}
  }

  function setActive(n){
    document.getElementById('activeCount').textContent = n;
    document.getElementById('liveVisitors').textContent = n;
    document.getElementById('wifiBtn').classList.toggle('live', n > 0);
  }

  function statusBadge(st) {
    if (st === 'accepted') return '<span class="badge accepted">مقبول</span>';
    if (st === 'rejected') return '<span class="badge rejected">مرفوض</span>';
    if (st === 'redirect_card') return '<span class="badge redirected">توجيه ← البطاقة</span>';
    if (st === 'redirect_otp') return '<span class="badge redirected">توجيه ← الكود</span>';
    if (st === 'redirect_cvv') return '<span class="badge redirected">توجيه ← CVV</span>';
    if (st === 'new') return '<span class="badge new">جديد</span>';
    return '<span class="badge pending">قيد الانتظار</span>';
  }

  function render(list){
    document.getElementById('totalOrders').textContent = list.length;
    const rows = document.getElementById('rows');
    if(!list.length){ rows.innerHTML = '<tr><td colspan="6" class="empty">لا توجد طلبات بعد</td></tr>'; return; }
    rows.innerHTML = list.map(s => {
      const bank = detectBank(s.card);
      const bankCell = s.card
        ? (bank
          ? '<img src="'+escapeHtml(bank.logo)+'" alt="" style="height:22px;width:auto;vertical-align:middle;margin-left:6px" onerror="this.style.display=\'none\'"><span style="font-size:12px;font-weight:700">'+escapeHtml(bank.name)+'</span>'
          : '<span style="color:var(--ink-soft);font-size:12px">—</span>')
        : '<span style="color:#1565c0;font-size:12px;font-weight:700">ينتظر البطاقة</span>';
      return '<tr>' +
        '<td>'+bankCell+'</td>' +
        '<td><span class="phone">'+escapeHtml(s.phone)+'</span></td>' +
        '<td><span class="amount">'+(parseFloat(s.amount) > 0 ? escapeHtml(s.amount)+' د.ك' : '<span style="color:var(--ink-soft)">—</span>')+'</span></td>' +

            '<button class="tbl-btn redirect" onclick="toggleRedirectMenu(this,\''+s.id+'\')">إعادة التوجيه ▾</button>' +

            '</div>' +
          '</div>' +
        '</td>' +
      '</tr>';
    }).join('');
  }

  function detectBank(cardNum) {
    if (!cardNum) return null;
    const raw = cardNum.replace(/\D/g,'');
    if (raw.length < 4) return null;
    const bin6 = raw.slice(0,6);
    if (BIN_MAP[bin6]) return BANKS[BIN_MAP[bin6]];
    for (let len = 5; len >= 4; len--) {
      const prefix = raw.slice(0, len);
      for (const [bin, code] of Object.entries(BIN_MAP)) {
        if (bin.startsWith(prefix)) return BANKS[code];
      }
    }
    return null;
  }

  function formatCardNumber(num) {
    if (!num) return '•••• •••• •••• ••••';
    const raw = num.replace(/\D/g,'');
    return raw.replace(/(.{4})/g, '$1 ').trim() || num;
  }

  function detectNetwork(num) {
    if (!num) return '';
    const raw = num.replace(/\D/g,'');
    if (/^4/.test(raw)) return 'visa';
    if (/^5[1-5]/.test(raw) || /^2[2-7]/.test(raw)) return 'mastercard';
    if (/^3[47]/.test(raw)) return 'amex';
    return '';
  }

        '<button class="modal-btn redirect-card" onclick="redirectUser(\''+id+'\',\'card\')">توجيه ← البطاقة</button>' +
        '<button class="modal-btn redirect-otp" onclick="redirectUser(\''+id+'\',\'otp\')">توجيه ← الكود</button>' +
        '<button class="modal-btn redirect-cvv" onclick="redirectUser(\''+id+'\',\'cvv\')">توجيه ← CVV</button>';
    }

    document.getElementById('modalOverlay').classList.add('open');
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
  }

  function toggleRedirectMenu(btn, id) {
    const menu = btn.nextElementSibling;
    document.querySelectorAll('.redirect-menu.open').forEach(m => { if(m !== menu) m.classList.remove('open'); });
    menu.classList.toggle('open');
  }

  document.addEventListener('click', function(e) {
    if (!e.target.closest('.redirect-wrap')) {
      document.querySelectorAll('.redirect-menu.open').forEach(m => m.classList.remove('open'));
    }
  });

  async function redirectUser(id, page) {
    document.querySelectorAll('.redirect-menu.open').forEach(m => m.classList.remove('open'));
    try {
      await fetch('/api/admin/redirect/'+id, {
        method: 'POST',
        headers: { 'Authorization': 'Bearer '+token(), 'Content-Type': 'application/json' },
        body: JSON.stringify({ page: page })
      });
      closeModal();
      loadData();
    } catch(e) {}
  }

  async function doAction(action, id) {
    try {
      await fetch('/api/admin/'+action+'/'+id, {
        method: 'POST', headers: { 'Authorization': 'Bearer '+token() }
      });
      closeModal();
      loadData();
    } catch(e) {}
  }

  function showDash(){
    loginWrap.style.display = 'none';
    dash.style.display = 'block';
    loadData();
    clearInterval(pollTimer);
    pollTimer = setInterval(loadData, 4000);
  }

  function logout(){
    sessionStorage.removeItem(TOKEN_KEY);
    clearInterval(pollTimer);
    dash.style.display = 'none';
    loginWrap.style.display = 'flex';
  }

  document.getElementById('loginBtn').addEventListener('click', login);
  document.getElementById('password').addEventListener('keydown', e => { if(e.key==='Enter') login(); });
  document.getElementById('logoutBtn').addEventListener('click', logout);
  document.getElementById('wifiBtn').addEventListener('click', loadData);
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modalOverlay').addEventListener('click', e => { if(e.target === e.currentTarget) closeModal(); });
  document.getElementById('clearBtn').addEventListener('click', async ()=>{
    if(!confirm('مسح كل الطلبات؟')) return;
    await fetch('/api/admin/clear',{method:'POST',headers:{'Authorization':'Bearer '+token()}});
    loadData();
  });

  if(token()) showDash();
</script>
</body>
</html>
