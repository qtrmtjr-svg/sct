services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stc
      POSTGRES_PASSWORD: stc
      POSTGRES_DB: stc
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stc -d stc"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - stc_pg_data:/var/lib/postgresql/data

volumes:
  stc_pg_data:
